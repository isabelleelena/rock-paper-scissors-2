<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors</title>
    <link rel="stylesheet" href="styles.css">
    <script src="scripts.js" defer></script>
</head>
<body>

    <h1>Rock, Paper, or Scissors?</h1>
    
    <div class="buttons">

        <div class="rock">
            
            <button class="r-button" type="button">
                <img src="rock.jpeg" alt="Rock Button Icon">
            </button>

        </div>

        <div class="paper">

            <button class="r-button" type="button">
                <img src="paper.jpeg" alt="Paper Button Icon">
            </button>

        </div>

        <div class="scissors">

            <button class="r-button" type="button">
                <img src="scissors.png" alt="Scissors Button Icon">
            </button>

        </div>

    </div>

</body>
</html>
